<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>청소도 팀워크! · 교동초 6학년 1반</title>
<style>
:root{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#163e35;background:#f4f4eb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;touch-action:manipulation}button:focus-visible{outline:4px solid #ef8b38;outline-offset:5px}button:disabled{cursor:default}.app{min-height:100dvh;max-width:2000px;margin:auto;padding:3vh 3.4vw 2vh;display:flex;flex-direction:column;gap:2.1vh}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.school{font-size:clamp(14px,1.15vw,24px);font-weight:700;letter-spacing:.04em}.tools{display:flex;gap:8px}.tool{border:1px solid #cfd8ce;background:#ffffff90;border-radius:12px;padding:10px 15px;color:#426052;font-size:clamp(13px,1vw,20px);cursor:pointer}.tool:disabled{opacity:.4}.intro{display:flex;align-items:end;justify-content:space-between;gap:24px}.eyebrow{color:#63806d;font-size:clamp(13px,1vw,20px);font-weight:700;margin:0 0 8px}.intro h1{font-size:clamp(34px,4vw,80px);letter-spacing:-.065em;line-height:1.12;margin:0;font-weight:900}.intro h1 em{font-style:normal;color:#e58138}.hint{font-size:clamp(15px,1.3vw,26px);line-height:1.6;color:#658073;margin:0 0 2px;text-align:right}.grid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.5vh 1.1vw;min-height:0}.role{--accent:#478673;--wash:#eaf3ed;position:relative;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:1.6vh;background:#fff;border:2px solid transparent;border-radius:24px;padding:2.2vh 1.7vw;box-shadow:0 4px 0 #dce3d8;cursor:pointer;color:#173e35;transition:transform .18s,border-color .18s,box-shadow .18s;min-width:0;min-height:0}.role:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 7px 0 #dce3d8;border-color:var(--accent)}.role:active:not(:disabled){transform:translateY(2px)}.role.complete{background:var(--wash);box-shadow:none;border-color:color-mix(in srgb,var(--accent) 20%,transparent)}.role-head{display:flex;align-items:center;gap:12px}.icon{display:grid;place-items:center;background:var(--wash);border-radius:16px;width:clamp(44px,4.3vw,80px);height:clamp(44px,4.3vw,80px);font-size:clamp(28px,2.8vw,54px);flex-shrink:0}.role-title{font-size:clamp(22px,2.05vw,43px);font-weight:900;letter-spacing:-.055em;white-space:nowrap}.quota{margin-left:auto;white-space:nowrap;align-self:start;font-size:clamp(12px,.95vw,20px);color:var(--accent);font-weight:800;background:var(--wash);border-radius:100px;padding:7px 10px}.slots{display:flex;gap:8px;min-height:5.5vh;align-items:stretch}.slot{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;background:#f7f8f3;border:1px dashed #cdd9cd;border-radius:12px;padding:10px 3px;font-size:clamp(19px,1.9vw,38px);font-weight:800;color:#9aab9d;letter-spacing:-.06em}.slot.filled{background:#fff;border:1px solid #d9e2d7;color:var(--accent)}.slot.fresh{animation:reveal .55s ease-out}.slot.rolling{background:var(--wash);color:var(--accent);border-style:solid}.role-foot{font-size:clamp(13px,1vw,20px);font-weight:600;color:#8b9b8b;display:flex;justify-content:space-between;gap:8px}.role-foot .arrow{color:var(--accent)}.complete .role-foot{color:var(--accent)}.footer{display:flex;align-items:center;gap:20px;padding-top:.5vh}.progress-copy{font-size:clamp(15px,1.25vw,26px);font-weight:700;white-space:nowrap}.progress-copy strong{font-size:1.5em}.track{height:10px;max-width:360px;flex:1;background:#dfe6d8;border-radius:100px;overflow:hidden}.bar{height:100%;background:#397c61;border-radius:100px;transition:width .4s}.save-note{margin-left:auto;font-size:clamp(12px,.95vw,19px);color:#758675;text-align:right}.announcement{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);padding:18px 30px;border-radius:100px;background:#173e35;color:white;box-shadow:0 8px 30px #163e3530;font-size:clamp(18px,1.7vw,32px);font-weight:800;z-index:10;pointer-events:none;max-width:95vw;text-align:center}.announcement[hidden]{display:none}dialog{border:none;border-radius:24px;padding:32px;max-width:450px;color:#173e35;box-shadow:0 20px 90px #1235}dialog::backdrop{background:#163e3570;backdrop-filter:blur(4px)}dialog h2{margin-top:0}dialog p{line-height:1.7;color:#627466}dialog .actions{display:flex;gap:10px;margin-top:24px}dialog button{padding:14px 20px;border:0;border-radius:12px;cursor:pointer;flex:1;background:#edf1e8;color:#173e35;font-weight:bold}dialog .confirm{background:#173e35;color:white}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@keyframes reveal{0%{transform:scale(.8);opacity:.3}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@media(min-width:1000px) and (min-height:600px){.app{height:100dvh}}@media(max-width:999px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}.role{min-height:210px;padding:22px}.app{padding:22px;gap:24px}.intro{align-items:start}.hint{font-size:14px}.role-title{font-size:25px}.slot{font-size:24px}.footer{flex-wrap:wrap}.save-note{width:100%;text-align:left;margin:0}.track{max-width:none}}@media(max-width:560px){.top{align-items:start}.school{max-width:130px;line-height:1.6}.tools{flex-wrap:wrap;justify-content:end}.tool{padding:9px;font-size:12px}.intro{display:block}.hint{text-align:left;margin-top:14px}.grid{grid-template-columns:1fr}.role{min-height:210px}.intro h1{font-size:42px}.app{padding:20px}.role-title{font-size:28px}.slot{font-size:30px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="school">조치원교동초등학교 <span style="color:#7f947e">/</span> 6학년 1반</div><nav class="tools" aria-label="추첨 도구"><button class="tool" id="undo" disabled>↶ 한 번 되돌리기</button><button class="tool" id="reset">새로 뽑기</button><button class="tool" id="fullscreen">⛶ 전체화면</button></nav></header>
<section class="intro"><div><p class="eyebrow">목요일 6교시 · 특활시간</p><h1>청소도 <em>팀워크!</em></h1></div><p class="hint">맡고 싶은 역할을 톡! 터치해 보세요.<br><strong>한 번 터치할 때마다 한 명씩, 중복 없이 뽑아요.</strong></p></section>
<section class="grid" id="roles" aria-label="청소 역할 추첨"></section>
<footer class="footer"><div class="progress-copy" id="progress">우리 반 13명 중 <strong>0</strong>명 배정</div><div class="track" role="progressbar" aria-label="배정 진행률" aria-valuemin="0" aria-valuemax="13" aria-valuenow="0"><div class="bar" id="bar" style="width:0%"></div></div><div class="save-note" id="saveNote">추첨 결과는 이 브라우저에 자동 저장돼요.</div></footer>
</main>
<div class="announcement" id="announcement" hidden></div><div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<dialog id="resetDialog"><h2>새롭게 역할을 뽑을까요?</h2><p>지금 배정된 역할을 모두 비우고<br>13명 전체가 다시 추첨에 참여해요.</p><div class="actions"><button id="cancelReset">그대로 두기</button><button id="confirmReset" class="confirm">새로 시작하기</button></div></dialog>
<script>
'use strict';
const STUDENTS=['장유하','백시우','홍서진','유지아','이용주','성다빈','변지웅','이소이','남여송','정효주','이승혁','이윤호','고은혜'];
const ROLES=[{id:'broom',name:'빗자루',count:3,icon:'🧹',accent:'#3c7d60',wash:'#e8f2e9'},{id:'recycle',name:'분리수거',count:3,icon:'♻️',accent:'#4388a2',wash:'#e7f2f6'},{id:'shelf',name:'선반 닦기',count:2,icon:'🧽',accent:'#b6842b',wash:'#faf1dc'},{id:'mop',name:'물걸레질',count:2,icon:'🪣',accent:'#7773ad',wash:'#eeecf8'},{id:'eraser',name:'연필자국 지우기',count:2,icon:'✏️',accent:'#c47964',wash:'#faede6'},{id:'vacuum',name:'청소기',count:1,icon:'💨',accent:'#4d918c',wash:'#e6f3ef'}];
const STORE='gyodong-6-1-cleaning-v1';
let assignments=load();let history=[];let busy=false;let fresh=null;let toastTimer;
function empty(){return Object.fromEntries(ROLES.map(role=>[role.id,[]]));}
function valid(data){if(!data||typeof data!=='object')return false;const used=new Set();return ROLES.every(role=>Array.isArray(data[role.id])&&data[role.id].length<=role.count&&data[role.id].every(name=>{if(!STUDENTS.includes(name)||used.has(name))return false;used.add(name);return true;}));}
function load(){try{const data=JSON.parse(localStorage.getItem(STORE));return valid(data)?data:empty();}catch{return empty();}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(assignments));document.getElementById('saveNote').textContent='추첨 결과는 이 브라우저에 자동 저장돼요.';}catch{document.getElementById('saveNote').textContent='저장이 제한되어 있어요. 화면을 닫기 전 결과를 기록해 주세요.';}}
function available(data=assignments){const used=new Set(Object.values(data).flat());return STUDENTS.filter(name=>!used.has(name));}
function randomIndex(length){const buffer=new Uint32Array(1);const limit=Math.floor(0x100000000/length)*length;do{crypto.getRandomValues(buffer);}while(buffer[0]>=limit);return buffer[0]%length;}
function render(){const grid=document.getElementById('roles');grid.replaceChildren();for(const role of ROLES){const names=assignments[role.id];const complete=names.length===role.count;const button=document.createElement('button');button.type='button';button.id='role-'+role.id;button.className='role'+(complete?' complete':'');button.style.setProperty('--accent',role.accent);button.style.setProperty('--wash',role.wash);button.disabled=complete||busy;button.setAttribute('aria-label',role.name+' '+names.length+'/'+role.count+'명 배정'+(complete?' 완료':'. 터치해서 한 명 뽑기'));button.innerHTML='<div class="role-head"><span class="icon" aria-hidden="true">'+role.icon+'</span><span class="role-title">'+role.name+'</span><span class="quota">'+names.length+' / '+role.count+'명</span></div><div class="slots"></div><div class="role-foot"><span>'+(complete?'모두 모였어요!':'터치해서 '+(names.length+1)+'번째 친구 뽑기')+'</span><span class="arrow">'+(complete?'✓ 배정 완료':'↗')+'</span></div>';const slots=button.querySelector('.slots');for(let i=0;i<role.count;i++){const slot=document.createElement('span');slot.className='slot'+(names[i]?' filled':'')+(fresh===role.id+'-'+i?' fresh':'');slot.textContent=names[i]||'?';slots.append(slot);}button.addEventListener('click',()=>draw(role.id));grid.append(button);}const count=STUDENTS.length-available().length;document.getElementById('progress').innerHTML=count===13?'우리 반 <strong>13</strong>명, 역할 배정 완료!':'우리 반 13명 중 <strong>'+count+'</strong>명 배정';document.getElementById('bar').style.width=(count/13*100)+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',count);document.getElementById('undo').disabled=busy||!history.length;document.getElementById('reset').disabled=busy;}
async function draw(id){const role=ROLES.find(role=>role.id===id);if(busy||!role||assignments[id].length>=role.count)return;const pool=available();if(!pool.length)return;busy=true;fresh=null;render();const slotIndex=assignments[id].length;const slot=document.querySelector('#role-'+id+' .slots').children[slotIndex];slot.classList.add('rolling');const winner=pool[randomIndex(pool.length)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(!reduced){await new Promise(resolve=>{let ticks=0;const timer=setInterval(()=>{slot.textContent=pool[ticks%pool.length];if(++ticks===9){clearInterval(timer);resolve();}},80);});}history.push(JSON.parse(JSON.stringify(assignments)));assignments[id].push(winner);fresh=id+'-'+slotIndex;busy=false;save();render();announce(winner+' · '+role.name+' 당첨!');const next=document.getElementById('role-'+id);if(!next.disabled)next.focus({preventScroll:true});}
function announce(text){document.getElementById('live').textContent=text;const toast=document.getElementById('announcement');toast.textContent=text;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,2200);}
document.getElementById('undo').addEventListener('click',()=>{if(busy||!history.length)return;assignments=history.pop();fresh=null;save();render();announce('마지막 추첨을 되돌렸어요.');});
const dialog=document.getElementById('resetDialog');document.getElementById('reset').addEventListener('click',()=>dialog.showModal());document.getElementById('cancelReset').addEventListener('click',()=>dialog.close());document.getElementById('confirmReset').addEventListener('click',()=>{if(busy)return;assignments=empty();history=[];fresh=null;save();render();dialog.close();announce('새로운 청소 팀을 뽑아 볼까요?');});
document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{announce('브라우저에서 F11을 눌러 전체화면으로 볼 수 있어요.');}});document.addEventListener('fullscreenchange',()=>document.getElementById('fullscreen').textContent=document.fullscreenElement?'⛶ 전체화면 끝내기':'⛶ 전체화면');
render();
</script>
</body></html>
